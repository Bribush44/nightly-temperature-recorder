<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Temperature Recorder</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
      --cooler: #dbeafe;
      --freezer: #e0f2fe;
      --accent: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 12px 32px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(241, 245, 249, 0.96);
      backdrop-filter: blur(10px);
      padding: 8px 0 12px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.35rem;
      text-align: center;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 48px;
    }

    #generateBtn {
      background: var(--accent);
      color: white;
    }

    #wakeBtn {
      background: #0f172a;
      color: white;
    }

    #wakeBtn.active {
      background: var(--success);
    }

    .status {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }

    .headers,
    .row {
      display: grid;
      grid-template-columns: 54px 1fr 1fr 64px;
      align-items: center;
      gap: 6px;
    }

    .headers {
      position: sticky;
      top: 126px;
      z-index: 8;
      background: var(--bg);
      font-weight: 800;
      padding: 10px 4px 7px;
      text-align: center;
      font-size: 0.92rem;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 62px;
      overflow: hidden;
    }

    .row-number {
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .temp {
      text-align: center;
      font-size: clamp(1.25rem, 6vw, 1.7rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      padding: 14px 4px;
    }

    .cooler {
      background: var(--cooler);
    }

    .freezer {
      background: var(--freezer);
    }

    .check {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .check button {
      width: 46px;
      height: 46px;
      min-height: 46px;
      padding: 0;
      border-radius: 50%;
      background: #dcfce7;
      color: var(--success);
      border: 2px solid #86efac;
      font-size: 1.35rem;
    }

    .empty {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 30px 16px;
      text-align: center;
      color: var(--muted);
    }

    .remaining {
      margin: 10px 0 8px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      .app { padding-left: 8px; padding-right: 8px; }
      .headers, .row {
        grid-template-columns: 40px 1fr 1fr 56px;
        gap: 4px;
      }
      .headers {
        top: 126px;
        font-size: 0.8rem;
      }
      .row-number { font-size: 0.78rem; }
      .check button {
        width: 42px;
        height: 42px;
        min-height: 42px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>Nightly Temperature Recorder</h1>

      <div class="controls">
        <button id="generateBtn">Generate 150 Rows</button>
        <button id="wakeBtn">Keep Screen Awake</button>
      </div>

      <div id="wakeStatus" class="status">
        Screen awake mode is off.
      </div>
    </div>

    <div class="headers">
      <div>#</div>
      <div>Cooler °F</div>
      <div>Freezer °F</div>
      <div>Done</div>
    </div>

    <div id="remaining" class="remaining"></div>
    <div id="list" class="list"></div>
  </main>

  <script>
    const ROW_COUNT = 150;
    const COOLER_MIN = 36.00;
    const COOLER_MAX = 40.00;
    const FREEZER_MIN = 0.00;
    const FREEZER_MAX = 15.00;

    const list = document.getElementById("list");
    const remaining = document.getElementById("remaining");
    const generateBtn = document.getElementById("generateBtn");
    const wakeBtn = document.getElementById("wakeBtn");
    const wakeStatus = document.getElementById("wakeStatus");

    let rows = [];
    let wakeLock = null;
    let wakeRequested = false;

    function randomTemp(min, max) {
      return (Math.random() * (max - min) + min).toFixed(2);
    }

    function generateRows() {
      rows = Array.from({ length: ROW_COUNT }, (_, index) => ({
        id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${index}-${Math.random()}`,
        originalNumber: index + 1,
        cooler: randomTemp(COOLER_MIN, COOLER_MAX),
        freezer: randomTemp(FREEZER_MIN, FREEZER_MAX)
      }));

      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function completeThrough(index) {
      // Remove the selected row AND everything above it.
      // This makes the next unrecorded row become the first visible row.
      rows = rows.slice(index + 1);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function render() {
      list.innerHTML = "";

      remaining.textContent = rows.length
        ? `${rows.length} row${rows.length === 1 ? "" : "s"} remaining`
        : "";

      if (!rows.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Tap “Generate 150 Rows” to create a new temperature list.";
        list.appendChild(empty);
        return;
      }

      rows.forEach((row, index) => {
        const item = document.createElement("div");
        item.className = "row";

        item.innerHTML = `
          <div class="row-number">${row.originalNumber}</div>
          <div class="temp cooler">${row.cooler}</div>
          <div class="temp freezer">${row.freezer}</div>
          <div class="check">
            <button
              type="button"
              aria-label="Mark row ${row.originalNumber} complete and remove previous rows"
              title="Done through row ${row.originalNumber}"
            >✓</button>
          </div>
        `;

        item.querySelector("button").addEventListener("click", () => {
          completeThrough(index);
        });

        list.appendChild(item);
      });
    }

    async function requestWakeLock() {
      wakeRequested = true;

      if (!("wakeLock" in navigator)) {
        wakeStatus.textContent =
          "Your browser does not support automatic screen wake lock. Increase your phone's Auto-Lock time while using the app.";
        wakeBtn.textContent = "Wake Lock Unsupported";
        return;
      }

      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeBtn.classList.add("active");
        wakeBtn.textContent = "Screen Awake ✓";
        wakeStatus.textContent = "Screen awake mode is on while this page stays open.";

        wakeLock.addEventListener("release", () => {
          wakeLock = null;
          wakeBtn.classList.remove("active");
          wakeBtn.textContent = "Keep Screen Awake";

          if (wakeRequested && document.visibilityState === "visible") {
            requestWakeLock();
          }
        });
      } catch (err) {
        wakeStatus.textContent =
          "Could not enable screen awake mode. Make sure this app is opened from an HTTPS website.";
      }
    }

    async function releaseWakeLock() {
      wakeRequested = false;

      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }

      wakeBtn.classList.remove("active");
      wakeBtn.textContent = "Keep Screen Awake";
      wakeStatus.textContent = "Screen awake mode is off.";
    }

    wakeBtn.addEventListener("click", () => {
      if (wakeRequested) {
        releaseWakeLock();
      } else {
        requestWakeLock();
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (
        wakeRequested &&
        document.visibilityState === "visible" &&
        !wakeLock &&
        "wakeLock" in navigator
      ) {
        requestWakeLock();
      }
    });

    generateBtn.addEventListener("click", generateRows);

    render();
  </script>
</body>
</html>
